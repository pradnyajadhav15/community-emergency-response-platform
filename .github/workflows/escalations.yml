name: Run escalations

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  escalate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger escalation check
        env:
          API_URL: ${{ secrets.CERP_API_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          BASE="${API_URL%/}"
          CODE=$(curl --silent --show-error --max-time 120 \
            -o response.json -w "%{http_code}" \
            -X POST "$BASE/api/internal/run-escalations/" \
            -H "X-Cron-Token: $CRON_TOKEN")
          echo "HTTP status: $CODE"
          cat response.json
          echo
          if [ "$CODE" != "200" ]; then exit 1; fi